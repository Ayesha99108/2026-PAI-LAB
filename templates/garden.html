<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Garden | Plant.Soul</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=3">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .full-garden {
            height: 70vh;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 20px;
            padding-bottom: 50px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 40px;
            margin-top: 40px;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.05);
            overflow: hidden;
            transition: background-image 0.5s ease-in-out;
        }
        .garden-stat-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }
        .stat-card {
            background: white;
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            border: 1px solid #eee;
        }
        .stat-card h3 { color: var(--plant-green); font-size: 2rem; }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="header-inner">
            <div class="logo-section">
                <i class="fas fa-leaf logo-icon"></i>
                <span class="logo-text">Plant.Soul</span>
            </div>
            <nav class="nav-links">
                <a href="/" class="nav-btn"><i class="fas fa-home"></i> Home</a>
                <a href="/garden_view" class="nav-btn active"><i class="fas fa-seedling"></i> Garden</a>
                <a href="/stats" class="nav-btn"><i class="fas fa-chart-line"></i> Growth</a>
                <a href="/contact" class="nav-btn"><i class="fas fa-envelope"></i> Contact</a>
            </nav>
        </div>
    </header>

    <main class="content-wrapper">
        <div class="quick-access-section">
            <h3>Garden Sanctuary</h3>
            <p class="section-desc">Observe the full breadth of your emotional landscape.</p>
        </div>

        <div class="full-garden" id="fullGardenStage">
            <!-- Full forest rendered here -->
        </div>

        <div class="garden-stat-bar">
            <div class="stat-card">
                <span style="color: #888;">Total Blooms</span>
                <h3 id="totalBlooms">0</h3>
            </div>
            <div class="stat-card">
                <span style="color: #888;">Primary Sentiment</span>
                <h3 id="primarySentiment">Peace</h3>
            </div>
            <div class="stat-card">
                <span style="color: #888;">Garden Health</span>
                <h3>Vibrant</h3>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const stage = document.getElementById('fullGardenStage');
            const totalDisplay = document.getElementById('totalBlooms');
            const primarySentimentDisplay = document.getElementById('primarySentiment');
            const res = await fetch('/history');
            const data = await res.json();
            
            totalDisplay.innerText = data.length;
            
            const emojiMap = {
                'sunflower': '🌻', 'rose': '🌹', 'bamboo': '🎋', 'lotus': '🪷',
                'weeping willow': '🌿', 'cactus': '🌵', 'fern': '🪴',
                'sprout': '🌱', 'hibiscus': '🌺', 'wilted rose': '🥀'
            };

            const bgMap = {
                'joy': 'url("https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&q=80&w=1920")',
                'love': 'url("https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&q=80&w=1920")',
                'calm': 'url("https://images.unsplash.com/photo-1511884642898-4c92249e20b6?auto=format&fit=crop&q=80&w=1920")',
                'peace': 'url("https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&q=80&w=1920")',
                'sadness': 'url("https://images.unsplash.com/photo-1518241353330-0f7941c2d9b5?auto=format&fit=crop&q=80&w=1920")',
                'anger': 'url("https://images.unsplash.com/photo-1527482797697-8795b05a13fe?auto=format&fit=crop&q=80&w=1920")',
                'stress': 'url("https://images.unsplash.com/photo-1499540633125-484965b60031?auto=format&fit=crop&q=80&w=1920")',
                'hope': 'url("https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&q=80&w=1920")',
                'excitement': 'url("https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&q=80&w=1920")',
                'regret': 'url("https://images.unsplash.com/photo-1444312645910-faa973a8d624?auto=format&fit=crop&q=80&w=1920")'
            };
            const defaultBg = 'url("https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1920&q=80")';

            const sentimentCounts = {};
            let maxSentiment = 'peace';

            data.forEach(item => {
                const el = document.createElement('div');
                el.style.fontSize = (Math.random() * 1.5 + 2.5) + 'rem';
                el.style.filter = 'drop-shadow(0px 10px 10px rgba(0,0,0,0.3))';
                el.style.margin = '0 ' + (Math.random() * 5 + 5) + 'px';
                el.style.animation = 'growBloom 1s ease-out';
                el.style.cursor = 'pointer';
                el.title = "Click to remove this reflection";
                el.innerHTML = emojiMap[item.plant] || '🌱';
                
                // Delete Functionality
                el.onclick = async () => {
                    if (confirm("Do you want to remove this plant from your garden?")) {
                        const delRes = await fetch('/delete/' + item.id, { method: 'POST' });
                        if (delRes.ok) {
                            el.style.transition = '0.5s';
                            el.style.opacity = '0';
                            el.style.transform = 'scale(0)';
                            setTimeout(() => location.reload(), 500);
                        }
                    }
                };
                
                stage.appendChild(el);
                
                if (item.sentiment) {
                    sentimentCounts[item.sentiment] = (sentimentCounts[item.sentiment] || 0) + 1;
                }
            });

            let maxCount = 0;
            for (let s in sentimentCounts) {
                if (sentimentCounts[s] > maxCount) {
                    maxCount = sentimentCounts[s];
                    maxSentiment = s;
                }
            }
            
            const finalBg = data.length > 0 ? (bgMap[maxSentiment] || defaultBg) : defaultBg;
            document.body.style.backgroundImage = finalBg;

            if (data.length > 0) {
                primarySentimentDisplay.innerText = maxSentiment.charAt(0).toUpperCase() + maxSentiment.slice(1);
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growth Stats | Plant.Soul</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header class="main-header">
        <div class="header-inner">
            <div class="logo-section">
                <i class="fas fa-leaf logo-icon"></i>
                <span class="logo-text">Plant.Soul</span>
            </div>
            <nav class="nav-links">
                <a href="/" class="nav-btn"><i class="fas fa-home"></i> Home</a>
                <a href="/garden_view" class="nav-btn"><i class="fas fa-seedling"></i> Garden</a>
                <a href="/stats" class="nav-btn active"><i class="fas fa-chart-line"></i> Growth</a>
                <a href="/contact" class="nav-btn"><i class="fas fa-envelope"></i> Contact</a>
            </nav>
        </div>
    </header>

    <main class="content-wrapper">
        <div class="quick-access-section">
            <h3>Growth Analytics</h3>
            <p class="section-desc">Visualize your emotional journey and soul progress.</p>
        </div>

        <div class="hero-carousel" style="grid-template-columns: 1fr 1fr; margin-top: 30px;">
            <div class="hero-card office-style" style="padding: 40px; min-height: 450px;">
                <h4 style="margin-bottom: 20px;">Emotional Distribution</h4>
                <canvas id="sentimentChart"></canvas>
            </div>
            <div class="hero-card office-style" style="padding: 40px; min-height: 450px;">
                <h4 style="margin-bottom: 20px;">Growth Over Time</h4>
                <canvas id="timelineChart"></canvas>
            </div>
        </div>

        <div class="category-grid" style="margin-top: 40px;">
            <div class="cat-card">
                <div class="cat-icon joy">🎉</div>
                <span>Most Frequent: Joy</span>
            </div>
            <div class="cat-card">
                <div class="cat-icon peace">🕊️</div>
                <span>Streak: 5 Days</span>
            </div>
            <div class="cat-card">
                <div class="cat-icon love">💝</div>
                <span>Recent Milestone: 10 Blooms</span>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const res = await fetch('/history');
            const data = await res.json();

            // Sentiment Chart
            const counts = {};
            data.forEach(item => counts[item.sentiment] = (counts[item.sentiment] || 0) + 1);
            
            new Chart(document.getElementById('sentimentChart'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(counts),
                    datasets: [{
                        data: Object.values(counts),
                        backgroundColor: ['#7fb03f', '#fecb00', '#2196f3', '#f06292', '#9c27b0']
                    }]
                },
                options: { plugins: { legend: { position: 'bottom' } } }
            });

            // Timeline Chart (Mocked trend for visual)
            new Chart(document.getElementById('timelineChart'), {
                type: 'line',
                data: {
                    labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                    datasets: [{
                        label: 'Reflections',
                        data: [2, 5, 3, 8, 4, 10, 7],
                        borderColor: '#7fb03f',
                        tension: 0.4
                    }]
                }
            });
        });
    </script>
</body>
</html>
